version: 2
updates:
- package-ecosystem: nuget
  directories:
    - "src/Pure.Chart.Model.HashCodes"
  schedule:
    interval: daily
  groups:
    production:
      patterns:
        - "*"
- package-ecosystem: nuget
  directories:
    - "src/Tests/Pure.Chart.Model.HashCodes.Tests"
  schedule:
    interval: daily
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: weekly
- package-ecosystem: "devcontainers"
  directory: "/"
  schedule:
    interval: weekly
